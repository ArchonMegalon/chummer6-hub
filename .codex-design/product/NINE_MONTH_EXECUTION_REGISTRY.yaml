rules:
  - This overlay sequences the active successor wave; it does not replace the active registry or milestone canon.
  - Every month must improve at least one golden journey and name the evidence source.
  - Cut breadth before journey proof, support closure honesty, or install/update coherence.
  - Weekly pulse snapshots should cite the active month and the next bounded checkpoint question while this overlay is active.


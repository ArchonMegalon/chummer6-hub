product: chummer
surface: chummer.run
version: 1
guest_readable_channels:
  - stable
release_notes_summary: The current preview centers one obvious installer, a visible proof trail, cleaner account handoff, and account-aware install linking without changing the signed artifact.
known_issues_label: Known issues and install help
known_issues_href: /help#install-update
install_help_label: Need install help?
install_help_href: /help#install-update
update_posture_summary: The release page is the source of truth for the current preview channel, the recommended installer, and whether you should expect a straightforward update or a manual handoff.
guest_gate_heading: Sign in to download the preview
guest_gate_summary: The current preview starts with a signed-in download so Chummer can attach the install handoff to your account from the first launch.
guest_gate_primary_label: Sign in to download preview
guest_gate_primary_href: /login?next=/downloads
guest_gate_secondary_label: Create account
guest_gate_secondary_href: /signup?next=/downloads
signed_in_dispatch_heading: Your preview download is starting
signed_in_dispatch_summary: This signed-in download keeps the installer canonical while minting the claim code you can use to link the installed copy back to this account on first launch.
signed_in_dispatch_steps:
  - Keep this page open until the installer download starts.
  - Copy the claim code if you want the installed copy linked to this account on first launch.
  - In Chummer, choose Link this copy to my account and paste the claim code.
  - You can reopen the pending claim code later under Devices and access.
install_steps:
  - Sign in before download so Chummer can attach the install handoff to your account.
  - Download the recommended installer for your platform.
  - Run the installer and launch Chummer.
  - On first launch, choose Link this copy to my account and paste the claim code from the download handoff.
  - Use Devices and access later if you need to reopen the pending claim code or review linked installs.
windows_requirements:
  - 64-bit Windows 10 or newer.
  - Enough free disk space for the installed preview plus future updates.
  - A normal user install path; no custom runtime selection needed for the recommended build.
linux_requirements:
  - 64-bit Linux with the currently published preview package support.
  - Use the recommended package when available; use manual packages only for advanced or support-directed installs.
macos_requirements:
  - macOS publishing is not on the current preview shelf.
  - Use the public roadmap and downloads page as the live source of truth before assuming a Mac build exists.

<svg xmlns="http://www.w3.org/2000/svg" width="1179" height="2556" viewBox="0 0 1179 2556" role="img" aria-labelledby="title desc">
  <title id="title">Chummer mobile PWA screenshot</title>
  <desc id="desc">Illustrated mobile app shell with install status, continuity summary, and role entry cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07131c"/>
      <stop offset="55%" stop-color="#10283a"/>
      <stop offset="100%" stop-color="#193f4e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#112534"/>
      <stop offset="100%" stop-color="#0c1d2b"/>
    </linearGradient>
  </defs>
  <rect width="1179" height="2556" fill="url(#bg)"/>
  <rect x="80" y="80" width="1019" height="2396" rx="72" fill="#081118" opacity="0.94"/>
  <rect x="142" y="170" width="895" height="420" rx="42" fill="url(#panel)"/>
  <text x="190" y="252" fill="#88e4ff" font-family="Space Grotesk, Arial, sans-serif" font-size="46">CHUMMER MOBILE</text>
  <text x="190" y="332" fill="#f4fbff" font-family="Space Grotesk, Arial, sans-serif" font-size="82" font-weight="700">Installable continuity shell</text>
  <text x="190" y="410" fill="#c8d9e2" font-family="Instrument Sans, Arial, sans-serif" font-size="34">Player, GM, and observer entry stay on one first-party route with offline fallback and session return cues.</text>
  <rect x="190" y="470" width="260" height="60" rx="30" fill="#d2f36a"/>
  <text x="230" y="510" fill="#07131c" font-family="IBM Plex Mono, monospace" font-size="28">INSTALL READY</text>
  <rect x="142" y="640" width="420" height="360" rx="36" fill="url(#panel)"/>
  <rect x="598" y="640" width="439" height="360" rx="36" fill="url(#panel)"/>
  <text x="182" y="722" fill="#f4fbff" font-family="Space Grotesk, Arial, sans-serif" font-size="48" font-weight="700">Continuity</text>
  <text x="182" y="792" fill="#c8d9e2" font-family="Instrument Sans, Arial, sans-serif" font-size="31">Active installs</text>
  <text x="182" y="856" fill="#88e4ff" font-family="IBM Plex Mono, monospace" font-size="84">12</text>
  <text x="182" y="920" fill="#c8d9e2" font-family="Instrument Sans, Arial, sans-serif" font-size="29">Reconnect posture, claims, and next-safe-action live on this rail.</text>
  <text x="638" y="722" fill="#f4fbff" font-family="Space Grotesk, Arial, sans-serif" font-size="48" font-weight="700">Install status</text>
  <text x="638" y="792" fill="#c8d9e2" font-family="Instrument Sans, Arial, sans-serif" font-size="31">Manifest, worker, return path</text>
  <text x="638" y="856" fill="#88e4ff" font-family="IBM Plex Mono, monospace" font-size="44">ONLINE / INSTALLABLE</text>
  <text x="638" y="920" fill="#c8d9e2" font-family="Instrument Sans, Arial, sans-serif" font-size="29">Download continuity stays separate; play posture stays explicit.</text>
  <text x="142" y="1118" fill="#88e4ff" font-family="Space Grotesk, Arial, sans-serif" font-size="42">ROLE ENTRY</text>
  <rect x="142" y="1160" width="895" height="220" rx="30" fill="url(#panel)"/>
  <rect x="142" y="1420" width="895" height="220" rx="30" fill="url(#panel)"/>
  <rect x="142" y="1680" width="895" height="220" rx="30" fill="url(#panel)"/>
  <text x="188" y="1250" fill="#f4fbff" font-family="Space Grotesk, Arial, sans-serif" font-size="52" font-weight="700">Player</text>
  <text x="188" y="1310" fill="#c8d9e2" font-family="Instrument Sans, Arial, sans-serif" font-size="30">Resume the session, dossier, and reconnect posture instantly.</text>
  <text x="188" y="1510" fill="#f4fbff" font-family="Space Grotesk, Arial, sans-serif" font-size="52" font-weight="700">GM</text>
  <text x="188" y="1570" fill="#c8d9e2" font-family="Instrument Sans, Arial, sans-serif" font-size="30">Keep the next scene and campaign continuity visible on mobile.</text>
  <text x="188" y="1770" fill="#f4fbff" font-family="Space Grotesk, Arial, sans-serif" font-size="52" font-weight="700">Observer</text>
  <text x="188" y="1830" fill="#c8d9e2" font-family="Instrument Sans, Arial, sans-serif" font-size="30">Bounded, read-mostly table visibility without route sprawl.</text>
  <rect x="142" y="1960" width="895" height="380" rx="36" fill="url(#panel)"/>
  <text x="188" y="2048" fill="#f4fbff" font-family="Space Grotesk, Arial, sans-serif" font-size="52" font-weight="700">Offline fallback</text>
  <text x="188" y="2120" fill="#c8d9e2" font-family="Instrument Sans, Arial, sans-serif" font-size="31">The shell keeps the mobile rail cached, preserves install cues, and returns people to the right continuity lane when the network drops.</text>
  <text x="188" y="2248" fill="#88e4ff" font-family="IBM Plex Mono, monospace" font-size="34">/mobile · /play · /play/continuity · /ready/handoff/mobile.json</text>
</svg>

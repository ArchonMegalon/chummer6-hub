[Service]
ExecStart=
ExecStart=/usr/bin/rclone mount "internxt:" "/mnt/internxt" \
  --rc \
  --rc-addr 127.0.0.1:5574 \
  --rc-no-auth \
  --config "/etc/rclone/internxt.conf" \
  --allow-other \
  --allow-non-empty \
  --umask 002 \
  --uid 1000 --gid 1000 \
  --dir-perms 0775 --file-perms 0664 \
  --dir-cache-time 15m \
  --poll-interval 0 \
  --vfs-cache-mode full \
  --cache-dir "/var/cache/rclone/internxt" \
  --vfs-cache-max-size 4G \
  --vfs-cache-max-age 24h \
  --vfs-cache-min-free-space 8G \
  --vfs-read-ahead 128M \
  --buffer-size 64M \
  --vfs-read-chunk-size 32M \
  --vfs-read-chunk-size-limit 1G \
  --timeout 30s \
  --contimeout 10s \
  --retries 10 \
  --retries-sleep 10s \
  --low-level-retries 20 \
  --tpslimit 8 \
  --tpslimit-burst 8 \
  --log-level INFO \
  --log-file "/var/log/rclone/internxt.log"

[Service]
ExecStartPre=
ExecStartPre=/bin/bash -lc 'mp="/mnt/%i"; mountpoint -q "$mp" && (fusermount3 -uz "$mp" || umount -l "$mp" || true) || true'
ExecStartPre=/bin/bash -lc 'mp="/mnt/%i"; mkdir -p "$mp" /var/cache/rclone/%i /var/log/rclone; chown tibor:tibor /var/cache/rclone/%i "$mp" /var/log/rclone; chmod 0775 "$mp" /var/cache/rclone/%i /var/log/rclone'
ExecStart=
ExecStart=/usr/bin/rclone mount "%i:" "/mnt/%i" \
  --rc \
  --rc-addr 127.0.0.1:5572 \
  --rc-no-auth \
  --config "/etc/rclone/%i.conf" \
  --allow-other \
  --allow-non-empty \
  --umask 002 \
  --uid 1000 --gid 1000 \
  --dir-perms 0775 --file-perms 0664 \
  --dir-cache-time 15m \
  --poll-interval 1m \
  --vfs-cache-mode writes \
  --cache-dir "/var/cache/rclone/%i" \
  --vfs-cache-max-size 12G \
  --vfs-cache-max-age 24h \
  --vfs-cache-min-free-space 8G \
  --vfs-read-ahead 256M \
  --buffer-size 64M \
  --vfs-read-chunk-size 64M \
  --vfs-read-chunk-size-limit 2G \
  --timeout 30s \
  --contimeout 10s \
  --retries 10 \
  --retries-sleep 10s \
  --low-level-retries 20 \
  --tpslimit 12 \
  --tpslimit-burst 16 \
  --log-level INFO \
  --log-file "/var/log/rclone/%i.log"

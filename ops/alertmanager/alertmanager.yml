global:
  resolve_timeout: 5m

route:
  receiver: primary_on_call
  group_by:
    - alertname
    - severity
    - slo
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: primary_on_call
    telegram_configs:
      - send_resolved: true
        bot_token_file: /run/secrets/chummer-observability/telegram-bot-token
        chat_id_file: /run/secrets/chummer-observability/telegram-chat-id
        parse_mode: ""
        disable_notifications: false
        message: >-
          Chummer public-edge {{ .Status }}: {{ range .Alerts }}{{ .Labels.alertname }}
          ({{ .Labels.severity }}, {{ .Labels.slo }}) — {{ .Annotations.summary }}{{ end }}

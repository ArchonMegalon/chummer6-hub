global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    deployment: chummer-public-edge

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - chummer-observability-alertmanager:9093

scrape_configs:
  - job_name: chummer-observability-prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: chummer-observability-alertmanager
    static_configs:
      - targets:
          - chummer-observability-alertmanager:9093

otlp:
  translation_strategy: UnderscoreEscapingWithSuffixes
  promote_resource_attributes:
    - service.name
    - deployment.environment.name

storage:
  tsdb:
    out_of_order_time_window: 30m
    retention:
      time: 28d

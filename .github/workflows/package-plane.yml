name: Hub package plane

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-siblings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install the digest-locked private .NET SDK
        shell: bash
        run: |
          hub_dotnet_script="${RUNNER_TEMP}/chummer-hub-dotnet-install.sh"
          hub_dotnet_root="${RUNNER_TEMP}/chummer-hub-dotnet"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://dot.net/v1/dotnet-install.sh --output "${hub_dotnet_script}"
          echo "082f7685e156738a1b2e2ed8381a621870d4ce8e8c59278034556f05c186eb2e  ${hub_dotnet_script}" \
            | sha256sum --check --strict
          bash "${hub_dotnet_script}" \
            --version 10.0.103 \
            --install-dir "${hub_dotnet_root}" \
            --no-path
          echo "${hub_dotnet_root}" >> "${GITHUB_PATH}"
          echo "DOTNET_ROOT=${hub_dotnet_root}" >> "${GITHUB_ENV}"
          "${hub_dotnet_root}/dotnet" --info
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Assert the hosted C# lane uses exact SDK 10.0.103
        shell: bash
        run: |
          test "$(dotnet --version)" = "10.0.103"
          test "$(python3 -c 'import json; print(json.load(open("global.json", encoding="utf-8"))["sdk"]["version"])')" = "10.0.103"
      - name: Install test runner
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          --requirement eng/ci-python-requirements.txt
      - name: Verify source policy
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -m pytest -q tests/test_hub_package_plane.py
      - name: Verify release fallback trust boundaries
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/materialize_hub_local_release_proof.py \
            scripts/verify_release_scope_decision.py \
            scripts/materialize_staged_release_finalizer_handoff.py \
            scripts/finalize_staged_release.py \
            scripts/release/verify_public_projection.py \
            scripts/verify_live_public_windows_installer.py
          bash -n scripts/release/verify_public_projection.sh
          bash -n Chummer.Run.Api/wwwroot/artifacts/mac-codex-release-pipeline/bootstrap.sh
          python3 -m pytest -q \
            tests/test_release_proof_authority_hardening.py \
            tests/test_live_public_windows_installer.py \
            tests/test_verify_release_scope_decision.py \
            tests/test_materialize_staged_release_finalizer_handoff.py \
            tests/test_finalize_staged_release.py \
            tests/test_mac_release_bootstrap_authority_closure.py \
            tests/test_mac_release_stage_only.py \
            tests/test_final_gold_janitor.py \
            tests/test_hub_local_release_proof_materializer_sync.py
      - name: Build and test C# projection contracts without siblings on SDK 10.0.103
        shell: bash
        run: >-
          python3 scripts/ai/verify-hub-package-plane.py
          --repo-root .
          --receipt "${RUNNER_TEMP}/HUB_NO_SIBLINGS_PACKAGE_PLANE.generated.json"
      - name: Upload immutable package-plane receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hub-no-siblings-package-plane-${{ github.sha }}
          path: ${{ runner.temp }}/HUB_NO_SIBLINGS_PACKAGE_PLANE.generated.json
          if-no-files-found: error
          retention-days: 30

  release-fallback-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up release Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          --requirement eng/ci-python-requirements.txt
      - name: Exercise release fallback on native macOS
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          bash -n scripts/release/verify_public_projection.sh
          bash -n Chummer.Run.Api/wwwroot/artifacts/mac-codex-release-pipeline/bootstrap.sh
          python3 -m py_compile \
            scripts/materialize_hub_local_release_proof.py \
            scripts/verify_release_scope_decision.py \
            scripts/materialize_staged_release_finalizer_handoff.py \
            scripts/finalize_staged_release.py \
            scripts/release/verify_public_projection.py \
            scripts/verify_live_public_windows_installer.py
          python3 -m pytest -q \
            tests/test_release_proof_authority_hardening.py \
            tests/test_live_public_windows_installer.py \
            tests/test_verify_release_scope_decision.py \
            tests/test_materialize_staged_release_finalizer_handoff.py \
            tests/test_finalize_staged_release.py \
            tests/test_mac_release_bootstrap_authority_closure.py \
            tests/test_mac_release_stage_only.py \
            tests/test_final_gold_janitor.py \
            tests/test_hub_local_release_proof_materializer_sync.py

name: Publish Wiki Documentation

on:
  push:
    branches: [master, main]
    paths:
      - 'Chummer/docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: publish-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check wiki repository
        id: wiki
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote "https://github.com/${GITHUB_REPOSITORY}.wiki.git" HEAD >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub wiki repository ${GITHUB_REPOSITORY}.wiki.git is unavailable; skipping wiki publish."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Wiki
        if: steps.wiki.outputs.available == 'true'
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: Chummer/docs/wiki
          commit-message: "Update wiki from Chummer/docs/wiki - ${{ github.sha }}"
          preprocess: true
          disable-empty-commits: true

name: Teable Important Work Sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teable-important-work-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Important Work Board
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync important work rows
        env:
          TEABLE_API_KEY: ${{ secrets.TEABLE_API_KEY }}
        run: >
          python3 scripts/sync_important_work_to_teable.py
          --sync
          --base-id bseQCIXVnYLcq2KiWzN
          --table-id tbl5UEwrkhI27HOlwkT

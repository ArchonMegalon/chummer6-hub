name: Private Rook contract lane

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d8 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned test runner
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          --requirement eng/ci-python-requirements.txt
      - name: Verify private Rook contracts without external calls
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -m pytest -q \
            tests/test_rook_private_compose_contract.py \
            tests/test_rook_private_deployment.py \
            tests/test_rook_readiness_endpoint_contract.py
      - name: Execute positive and negative deployment preflight
        shell: bash
        run: |
          env_file="${RUNNER_TEMP}/rook-private.env"
          umask 077
          cat > "${env_file}" <<'EOF'
          CHUMMER_BUILD_GHOST_PRIVATE_TOOL_ENDPOINT=https://chummer.run/api/v1/ai/build-ghost/tool
          CHUMMER_BUILD_GHOST_PRIVATE_TOOL_AUTH_AUDIENCE=build-ghost-private-tool
          CHUMMER_BUILD_GHOST_PRIVATE_TOOL_AUTHORITY_ENDPOINT=https://chummer.run/api/internal/build-ghost/tool/resolve
          CHUMMER_BUILD_GHOST_PRIVATE_TOOL_SERVICE_TOKEN=ssssssssssssssssssssssssssssssss
          CHUMMER_AI_INTERNAL_API_TOKEN=iiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii
          EOF
          python3 scripts/verify_rook_private_deployment.py \
            --image ghcr.io/example/rook@sha256:$(printf 'a%.0s' {1..64}) \
            --env-file "${env_file}"
          if python3 scripts/verify_rook_private_deployment.py \
            --image ghcr.io/example/rook:latest \
            --env-file "${RUNNER_TEMP}/missing-rook.env"; then
            echo 'negative preflight unexpectedly passed' >&2
            exit 1
          fi

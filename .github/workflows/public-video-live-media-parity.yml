name: Public Video Live Media Parity

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public origin to verify"
        required: false
        default: "https://chummer.run"

permissions:
  contents: read

jobs:
  verify-live-media:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install media probes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m pip install --disable-pip-version-check --no-cache-dir numpy

      - name: Verify live public media bytes and audio
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_public_video_live_media_parity.py \
            --base-url "${{ inputs.base_url }}"

      - name: Upload live parity receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-video-live-media-parity
          path: .codex-studio/published/PUBLIC_VIDEO_LIVE_MEDIA_PARITY.generated.json
          if-no-files-found: warn
          retention-days: 14

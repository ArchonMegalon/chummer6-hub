name: Windows Installer Gold Proof

on:
  workflow_dispatch:
    inputs:
      installer_url:
        description: "Optional installer URL to download before proof capture"
        required: false
        default: ""
        type: string
      ui_desktop_run_id:
        description: "Optional chummer6-ui Desktop Downloads Matrix run ID to proof before publication"
        required: false
        default: ""
        type: string
      ui_desktop_artifact_name:
        description: "Artifact name from the chummer6-ui run"
        required: false
        default: "desktop-avalonia-win-x64"
        type: string
      auto_capture_visuals:
        description: "Capture visual audit screenshots automatically"
        required: false
        default: true
        type: boolean
      scaled_dpi_scale:
        description: "Scaled DPI label to record for the second screenshot pass"
        required: false
        default: "1.5"
        type: string
      auto_capture_timeout_seconds:
        description: "Seconds to wait for each requested installer surface before failing capture"
        required: false
        default: "45"
        type: string

permissions:
  contents: read

concurrency:
  group: windows-installer-gold-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-proof:
    name: Capture Native Windows Installer Proof
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ensure installer artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerPath = "Chummer.Portal/downloads/files/chummer-avalonia-win-x64-installer.exe"
          $installerUrl = "${{ inputs.installer_url }}"
          $uiDesktopRunId = "${{ inputs.ui_desktop_run_id }}"
          $uiDesktopArtifactName = "${{ inputs.ui_desktop_artifact_name }}"
          if (-not [string]::IsNullOrWhiteSpace($uiDesktopRunId)) {
            $downloadRoot = Join-Path $env:RUNNER_TEMP "chummer-ui-desktop-artifact"
            if (Test-Path -LiteralPath $downloadRoot) {
              Remove-Item -LiteralPath $downloadRoot -Recurse -Force
            }
            New-Item -ItemType Directory -Force -Path $downloadRoot | Out-Null
            $env:GH_TOKEN = "${{ github.token }}"
            gh run download $uiDesktopRunId --repo ArchonMegalon/chummer6-ui --name $uiDesktopArtifactName --dir $downloadRoot
            $candidate = Join-Path $downloadRoot "chummer-avalonia-win-x64-installer.exe"
            if (-not (Test-Path -LiteralPath $candidate)) {
              $candidate = Get-ChildItem -LiteralPath $downloadRoot -Recurse -File -Filter "chummer-avalonia-win-x64-installer.exe" | Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not (Test-Path -LiteralPath $candidate)) {
              throw "Downloaded UI artifact '$uiDesktopArtifactName' from run '$uiDesktopRunId' did not contain chummer-avalonia-win-x64-installer.exe."
            }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $installerPath) | Out-Null
            Copy-Item -LiteralPath $candidate -Destination $installerPath -Force
            $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
            "Downloaded Windows installer from chummer6-ui run $uiDesktopRunId artifact $uiDesktopArtifactName"
            "sha256:$hash"
            return
          }
          if ([string]::IsNullOrWhiteSpace($installerUrl) -and (Test-Path -LiteralPath $installerPath)) {
            "Installer already present: $installerPath"
            return
          }

          if ([string]::IsNullOrWhiteSpace($installerUrl)) {
            $releaseChannelPath = "Chummer.Portal/downloads/RELEASE_CHANNEL.generated.json"
            if (Test-Path -LiteralPath $releaseChannelPath) {
              $releaseChannel = Get-Content -LiteralPath $releaseChannelPath -Raw | ConvertFrom-Json
              $artifact = @($releaseChannel.artifacts) | Where-Object { $_.artifactId -eq "avalonia-win-x64-installer" } | Select-Object -First 1
              if ($null -ne $artifact -and -not [string]::IsNullOrWhiteSpace([string]$artifact.downloadUrl)) {
                $installerUrl = [string]$artifact.downloadUrl
              }
            }
          }
          if ([string]::IsNullOrWhiteSpace($installerUrl)) {
            $installerUrl = "https://chummer.run/downloads/files/chummer-avalonia-win-x64-installer.exe"
          }
          if ($installerUrl.StartsWith("/", [System.StringComparison]::Ordinal)) {
            $installerUrl = "https://chummer.run$installerUrl"
          }

          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $installerPath) | Out-Null
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "Downloaded Windows installer from $installerUrl"
          "sha256:$hash"

      - name: Capture native startup and visual evidence
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          $visualRoot = "Chummer.Portal/downloads/visual-audit/windows-installer"
          if (Test-Path -LiteralPath $visualRoot) {
            Remove-Item -LiteralPath $visualRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $visualRoot | Out-Null
          $generatedAuditPath = ".codex-studio/published/WINDOWS_INSTALLER_VISUAL_AUDIT.generated.json"
          if (Test-Path -LiteralPath $generatedAuditPath) {
            Remove-Item -LiteralPath $generatedAuditPath -Force
          }
          $tracePath = Join-Path $env:TEMP "chummer-desktop-installer-progress.log"
          if (Test-Path -LiteralPath $tracePath) {
            Remove-Item -LiteralPath $tracePath -Force
          }
          $proofArgs = @{
            LaunchInstaller = $true
          }
          if ("${{ inputs.auto_capture_visuals }}" -eq "true") {
            $proofArgs["CaptureVisualAudit"] = $true
            $proofArgs["AutoCaptureVisualAudit"] = $true
            $proofArgs["ScaledDpiScale"] = "${{ inputs.scaled_dpi_scale }}"
            $proofArgs["AutoCaptureTimeoutSeconds"] = [int]"${{ inputs.auto_capture_timeout_seconds }}"
            $proofArgs["VisualClippingStatus"] = "pass"
            $proofArgs["VisualReadabilityStatus"] = "pass"
          }
          & .\scripts\capture_windows_installer_gold_proof.ps1 @proofArgs

      - name: Collect Windows installer diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $visualRoot = "Chummer.Portal/downloads/visual-audit/windows-installer"
          New-Item -ItemType Directory -Force -Path $visualRoot | Out-Null
          $traceCandidates = @(
            (Join-Path $env:TEMP "chummer-desktop-installer-progress.log"),
            (Join-Path $env:LOCALAPPDATA "Chummer6/Installer/chummer-desktop-installer-progress.log")
          )
          foreach ($candidate in $traceCandidates) {
            if (Test-Path -LiteralPath $candidate) {
              $safeName = [System.IO.Path]::GetFileName($candidate)
              Copy-Item -LiteralPath $candidate -Destination (Join-Path $visualRoot $safeName) -Force
            }
          }

      - name: Verify proof receipt
        id: verify
        shell: pwsh
        continue-on-error: true
        run: python scripts/verify_windows_installer_visual_audit.py

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-gold-proof
          if-no-files-found: warn
          retention-days: 14
          path: |
            Chummer.Portal/downloads/startup-smoke/startup-smoke-avalonia-win-x64.receipt.json
            Chummer.Portal/downloads/visual-audit/windows-installer/**
            .codex-studio/published/WINDOWS_INSTALLER_VISUAL_AUDIT.generated.json

      - name: Explain review boundary
        if: always()
        shell: pwsh
        run: |
          "## Windows Installer Gold Proof" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "This workflow collects native Windows proof artifacts only. It does not publish downloads." >> $env:GITHUB_STEP_SUMMARY
          "Auto-captured visual rows use native window-bounds screenshots. The verifier fails if required surfaces are missing or byte-identical." >> $env:GITHUB_STEP_SUMMARY
          "The capture step has a hard timeout and writes WINDOWS_INSTALLER_CAPTURE_FAILURE.txt when the installer surface cannot be captured." >> $env:GITHUB_STEP_SUMMARY
          "After downloading the artifact, import it with: python3 scripts/import_windows_installer_gold_proof_artifact.py windows-installer-gold-proof.zip --verify" >> $env:GITHUB_STEP_SUMMARY
          "Verifier outcome: ${{ steps.verify.outcome }}" >> $env:GITHUB_STEP_SUMMARY

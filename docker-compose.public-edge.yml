services:
  chummer-run-identity:
    image: chummer-run-identity:local
    restart: unless-stopped
    build:
      context: /docker
      dockerfile: chummercomplete/chummer.run-services/Chummer.Run.Identity/Dockerfile
    environment:
      ASPNETCORE_HTTPS_PORT: ${ASPNETCORE_HTTPS_PORT:-443}
      CHUMMER_IDENTITY_STORE_PATH: /app/state/identity-store.json
      CHUMMER_IDENTITY_EMAIL_DELIVERY_STORE_PATH: /app/state/identity-email-delivery.json
      IDENTITY_PUBLIC_BASE_URL: ${IDENTITY_PUBLIC_BASE_URL:-https://chummer.run}
      IDENTITY_ADMIN_KEY: ${IDENTITY_ADMIN_KEY:-}
      IDENTITY_EMAIL_PROVIDER_ORDER: ${IDENTITY_EMAIL_PROVIDER_ORDER:-emailit_api,smtp}
      IDENTITY_EMAIL_REPLY_TO: ${IDENTITY_EMAIL_REPLY_TO:-support@chummer.run}
      IDENTITY_EMAILIT_API_KEY: ${IDENTITY_EMAILIT_API_KEY:-}
      IDENTITY_EMAILIT_BASE_URL: ${IDENTITY_EMAILIT_BASE_URL:-https://api.emailit.com/v2}
      IDENTITY_EMAILIT_FROM_EMAIL: ${IDENTITY_EMAILIT_FROM_EMAIL:-god@chummer.run}
      IDENTITY_EMAILIT_FROM_NAME: ${IDENTITY_EMAILIT_FROM_NAME:-God}
      IDENTITY_EMAILIT_WEBHOOK_SECRET: ${IDENTITY_EMAILIT_WEBHOOK_SECRET:-}
      IDENTITY_SMTP_HOST: ${IDENTITY_SMTP_HOST:-}
      IDENTITY_SMTP_PORT: ${IDENTITY_SMTP_PORT:-587}
      IDENTITY_SMTP_USERNAME: ${IDENTITY_SMTP_USERNAME:-}
      IDENTITY_SMTP_PASSWORD: ${IDENTITY_SMTP_PASSWORD:-}
      IDENTITY_SMTP_FROM_EMAIL: ${IDENTITY_SMTP_FROM_EMAIL:-god@chummer.run}
      IDENTITY_SMTP_FROM_NAME: ${IDENTITY_SMTP_FROM_NAME:-God}
      IDENTITY_SMTP_USE_SSL: ${IDENTITY_SMTP_USE_SSL:-true}
    volumes:
      - chummer-run-identity-state:/app/state
    networks:
      public-origin:
        aliases:
          - chummer-run-identity

  chummer-portal:
    image: chummer-run-api:local
    restart: unless-stopped
    build:
      context: /docker
      dockerfile: chummercomplete/chummer.run-services/Chummer.Run.Api/Dockerfile
    depends_on:
      - chummer-run-identity
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTPS_PORT: ${ASPNETCORE_HTTPS_PORT:-443}
      CHUMMER_PUBLIC_CANON_ROOT: /repo
      CHUMMER_PUBLIC_FLEET_ARTIFACT_ROOT: /fleet-artifacts
      CHUMMER_COMMUNITY_STORE_PATH: /app/state/community-store.json
      CHUMMER_DATA_PROTECTION_KEYS_PATH: /app/state/data-protection-keys
      CHUMMER_RELEASE_UPLOAD_TICKET_LIFETIME_MINUTES: ${CHUMMER_RELEASE_UPLOAD_TICKET_LIFETIME_MINUTES:-720}
      CHUMMER_PUBLIC_DISABLED_ARTIFACT_IDS: ${CHUMMER_PUBLIC_DISABLED_ARTIFACT_IDS:-avalonia-win-x64-installer,blazor-desktop-win-x64-installer}
      IDENTITY_SERVICE_BASE_URL: http://chummer-run-identity:8080
      IDENTITY_ADMIN_KEY: ${IDENTITY_ADMIN_KEY:-}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-}
      GOOGLE_OIDC_REDIRECT_URI: ${GOOGLE_OIDC_REDIRECT_URI:-https://chummer.run/auth/google/callback}
      FLEET_CONTROLLER_BASE_URL: ${FLEET_CONTROLLER_BASE_URL:-http://fleet-controller:8090}
      FLEET_INTERNAL_API_TOKEN: ${FLEET_INTERNAL_API_TOKEN:-}
      CHUMMER_PARTICIPATION_DEFAULT_PROJECT_ID: ${CHUMMER_PARTICIPATION_DEFAULT_PROJECT_ID:-hub}
      CHUMMER_DOWNLOADS_SOURCE_ROOT: /downloads-source
      CHUMMER_API_WRITE_RATE_LIMIT_PER_MINUTE: ${CHUMMER_API_WRITE_RATE_LIMIT_PER_MINUTE:-120}
      CHUMMER_API_RATE_LIMIT_QUEUE: ${CHUMMER_API_RATE_LIMIT_QUEUE:-16}
      CHUMMER_TEABLE_USERS_ENABLED: ${CHUMMER_TEABLE_USERS_ENABLED:-true}
      CHUMMER_TEABLE_USERS_API_KEY: ${CHUMMER_TEABLE_USERS_API_KEY:-}
      TEABLE_API_KEY: ${TEABLE_API_KEY:-}
      CHUMMER_TEABLE_USERS_API_BASE_URL: ${CHUMMER_TEABLE_USERS_API_BASE_URL:-https://app.teable.ai/api}
      CHUMMER_TEABLE_USERS_BASE_ID: ${CHUMMER_TEABLE_USERS_BASE_ID:-}
      CHUMMER_TEABLE_USERS_TABLE_ID: ${CHUMMER_TEABLE_USERS_TABLE_ID:-}
      CHUMMER_TEABLE_USERS_TABLE_NAME: ${CHUMMER_TEABLE_USERS_TABLE_NAME:-Chummer Run Users}
      CHUMMER_TEABLE_USERS_RECONCILE_ENABLED: ${CHUMMER_TEABLE_USERS_RECONCILE_ENABLED:-true}
      CHUMMER_TEABLE_USERS_RECONCILE_INITIAL_DELAY_SECONDS: ${CHUMMER_TEABLE_USERS_RECONCILE_INITIAL_DELAY_SECONDS:-15}
      CHUMMER_TEABLE_USERS_RECONCILE_INTERVAL_MINUTES: ${CHUMMER_TEABLE_USERS_RECONCILE_INTERVAL_MINUTES:-30}
    volumes:
      - chummer-run-api-state:/app/state
      - ./:/repo:ro
      - /docker/fleet/.codex-studio/published:/fleet-artifacts:ro
      - /docker/chummercomplete/chummer.run-services/Chummer.Portal/downloads:/downloads-source
    ports:
      - "${CHUMMER_PUBLIC_EDGE_PORT:-8091}:8080"
    networks:
      public-origin:
        aliases:
          - ${CHUMMER_PUBLIC_EDGE_ALIAS:-chummer-portal}
      fleet-origin: {}

volumes:
  chummer-run-api-state:
  chummer-run-identity-state:

networks:
  public-origin:
    external: true
    name: "${CHUMMER_RUN_TUNNEL_NETWORK:-chummer5a_default}"
  fleet-origin:
    external: true
    name: "${CHUMMER_FLEET_NETWORK:-codex-fleet-net}"

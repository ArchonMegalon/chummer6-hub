      ANSWERLY_OPENAI_COMPAT_RULE_GHOST_MODEL_ID: ${ANSWERLY_OPENAI_COMPAT_RULE_GHOST_MODEL_ID:-sr-rulebot}
      ANSWERLY_OPENAI_COMPAT_EA_PRIMARY_ENABLED: ${ANSWERLY_OPENAI_COMPAT_EA_PRIMARY_ENABLED:-true}
      ANSWERLY_OPENAI_COMPAT_LOCAL_FALLBACK_ENABLED: ${ANSWERLY_OPENAI_COMPAT_LOCAL_FALLBACK_ENABLED:-true}
      ANSWERLY_OPENAI_COMPAT_EA_UPSTREAM_BASE_URL: ${ANSWERLY_OPENAI_COMPAT_EA_UPSTREAM_BASE_URL:-https://code.girschele.com}
      ANSWERLY_OPENAI_COMPAT_EA_UPSTREAM_BEARER_TOKEN: ${ANSWERLY_OPENAI_COMPAT_EA_UPSTREAM_BEARER_TOKEN:-}
      ANSWERLY_OPENAI_COMPAT_EA_CF_ACCESS_CLIENT_ID: ${ANSWERLY_OPENAI_COMPAT_EA_CF_ACCESS_CLIENT_ID:-}
      ANSWERLY_OPENAI_COMPAT_EA_CF_ACCESS_CLIENT_SECRET: ${ANSWERLY_OPENAI_COMPAT_EA_CF_ACCESS_CLIENT_SECRET:-}
      ANSWERLY_OPENAI_COMPAT_EA_HTTP_REFERER: ${ANSWERLY_OPENAI_COMPAT_EA_HTTP_REFERER:-https://chummer.run}
      ANSWERLY_OPENAI_COMPAT_EA_X_TITLE: ${ANSWERLY_OPENAI_COMPAT_EA_X_TITLE:-Chummer Rule Ghost}
    volumes:
      - ${CHUMMER_PUBLIC_PORTAL_APP_OVERLAY_DIR:-/docker/chummercomplete/chummer.run-services/.state/public-edge-portal-overlay/app}:/app:ro
      - chummer-run-api-state:/app/state
      # Both host files must be owned by CHUMMER_PORTAL_UID and have mode 0400 or 0600.
      - ${CHUMMER_DATA_PROTECTION_CERTIFICATE_FILE:?Set the container-user-owned PKCS#12 key-encryption certificate file}:/run/chummer-secrets/data-protection-key-encryption.pfx:ro
      - ${CHUMMER_DATA_PROTECTION_CERTIFICATE_PASSWORD_FILE:?Set the container-user-owned certificate password file}:/run/chummer-secrets/data-protection-key-encryption.password:ro
      # This runtime-only credential must be owned by CHUMMER_PORTAL_UID and have mode 0400 or 0600.
      - ${CHUMMER_INSTALL_LINKING_POSTGRES_RUNTIME_CONNECTION_FILE:?Set the container-user-owned InstallLinking PostgreSQL runtime connection file}:/run/chummer-secrets/install-linking-postgres-runtime.connection-string:ro
      - /docker/fleet/.codex-studio/published:/fleet-artifacts:ro
      - /docker/chummercomplete/chummer.run-services/Chummer.Portal/downloads:/downloads-source
      - chummer-release-upload-sessions:/release-upload-sessions
      - chummer-windows-proof-store:/windows-proof-store
      - chummer-windows-proof-upload-sessions:/windows-proof-upload-sessions
      # The root is the authenticated CURRENT authority. The non-webroot compatibility bind
      # is resolved from that same immutable snapshot by deploy/recovery before Compose runs.
      - ${CHUMMER_PUBLIC_EDGE_PROJECTION_SNAPSHOT_ROOT:?Set the authenticated public projection snapshot root}:/public-projection:ro
      - ${CHUMMER_PUBLIC_EDGE_RUNTIME_PROOF_BIND_SOURCE:?Set the authenticated CURRENT Hub proof output}:/proofs/HUB_LOCAL_RELEASE_PROOF.generated.json:ro
      - /docker/chummercomplete/chummer.run-services/.codex-studio/published/FINAL_GOLD_JANITOR.generated.json:/proofs/FINAL_GOLD_JANITOR.generated.json:ro
    ports:
      - "${CHUMMER_PUBLIC_EDGE_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "--header", "Host: chummer.run", "http://127.0.0.1:8080/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: ${CHUMMER_PORTAL_MEMORY_LIMIT:-1536m}
    cpu_shares: 256
    cpus: ${CHUMMER_PORTAL_CPUS:-1.00}
    networks:
      public-origin:
        aliases:
          - ${CHUMMER_PUBLIC_EDGE_ALIAS:-chummer-portal}
      fleet-origin: {}
      ea-origin: {}

  # Operator-only jobs for a managed/external PostgreSQL authority. These services use a
  # dedicated tool-only image target and deliberately omit the portal's /app overlay.
  chummer-install-linking-postgres-admin:
    image: chummer-install-linking-postgres-tool:local
    profiles: ["install-linking-postgres-admin"]
    restart: "no"
    build:
      context: ${CHUMMER_PUBLIC_EDGE_BUILD_CONTEXT:-/docker/chummercomplete}
      dockerfile: ${CHUMMER_RUN_SERVICES_CONTEXT_DIR:-chummer.run-services}/Chummer.Run.Api/Dockerfile
      target: install-linking-postgres-tool-final
      additional_contexts:
        run-services-source: ${CHUMMER_RUN_SERVICES_SOURCE:-/docker/chummercomplete/chummer.run-services}
        fleet-media-factory-contracts: /docker/fleet/repos/chummer-media-factory/src/Chummer.Media.Contracts
        design-product: /docker/chummercomplete/chummer-design
      args:
        CHUMMER_BUILD_CONCURRENCY: ${CHUMMER_BUILD_CONCURRENCY:-1}
        CHUMMER_RUNTIME_UID: ${CHUMMER_PORTAL_UID:-1654}
        CHUMMER_RUNTIME_GID: ${CHUMMER_PORTAL_GID:-1654}
    user: "${CHUMMER_PORTAL_UID:-1654}:${CHUMMER_PORTAL_GID:-1654}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    environment:
      CHUMMER_INSTALL_LINKING_MIGRATOR_CONNECTION_STRING_FILE: /run/chummer-secrets/install-linking-postgres-migrator.connection-string
      CHUMMER_INSTALL_LINKING_POSTGRES_RUNTIME_ROLE: "${CHUMMER_INSTALL_LINKING_POSTGRES_RUNTIME_ROLE:?Set the pre-existing InstallLinking PostgreSQL runtime role}"
    volumes:
      # The migrator credential is never mounted into the long-running portal or the import job.
      - ${CHUMMER_INSTALL_LINKING_POSTGRES_MIGRATOR_CONNECTION_FILE:?Set the container-user-owned InstallLinking PostgreSQL migrator connection file}:/run/chummer-secrets/install-linking-postgres-migrator.connection-string:ro
    # Safe default: validate only. Operators must explicitly override this with `prepare <runtime-role>`.
    command: ["validate"]
    networks:
      public-origin: {}

  chummer-install-linking-postgres-import:
    image: chummer-install-linking-postgres-tool:local
    profiles: ["install-linking-postgres-admin"]
    restart: "no"
    build:
      context: ${CHUMMER_PUBLIC_EDGE_BUILD_CONTEXT:-/docker/chummercomplete}
      dockerfile: ${CHUMMER_RUN_SERVICES_CONTEXT_DIR:-chummer.run-services}/Chummer.Run.Api/Dockerfile
      target: install-linking-postgres-tool-final
      additional_contexts:
        run-services-source: ${CHUMMER_RUN_SERVICES_SOURCE:-/docker/chummercomplete/chummer.run-services}
        fleet-media-factory-contracts: /docker/fleet/repos/chummer-media-factory/src/Chummer.Media.Contracts
        design-product: /docker/chummercomplete/chummer-design
      args:
        CHUMMER_BUILD_CONCURRENCY: ${CHUMMER_BUILD_CONCURRENCY:-1}
        CHUMMER_RUNTIME_UID: ${CHUMMER_PORTAL_UID:-1654}
        CHUMMER_RUNTIME_GID: ${CHUMMER_PORTAL_GID:-1654}
    user: "${CHUMMER_PORTAL_UID:-1654}:${CHUMMER_PORTAL_GID:-1654}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      CHUMMER_DATA_PROTECTION_KEYS_PATH: /app/state/data-protection-keys
      CHUMMER_DATA_PROTECTION_CERTIFICATE_PATH: /run/chummer-secrets/data-protection-key-encryption.pfx
      CHUMMER_DATA_PROTECTION_CERTIFICATE_PASSWORD_FILE: /run/chummer-secrets/data-protection-key-encryption.password
      CHUMMER_INSTALL_LINKING_STORE_PATH: /app/state/install-linking/install-linking-store.json
      CHUMMER_INSTALL_LINKING_POSTGRES_CONNECTION_STRING_FILE: /run/chummer-secrets/install-linking-postgres-runtime.connection-string
    volumes:
      # The import job shares only the state and cryptographic material needed to decrypt the local snapshot.
      - chummer-run-api-state:/app/state
      - ${CHUMMER_DATA_PROTECTION_CERTIFICATE_FILE:?Set the container-user-owned PKCS#12 key-encryption certificate file}:/run/chummer-secrets/data-protection-key-encryption.pfx:ro
      - ${CHUMMER_DATA_PROTECTION_CERTIFICATE_PASSWORD_FILE:?Set the container-user-owned certificate password file}:/run/chummer-secrets/data-protection-key-encryption.password:ro
      - ${CHUMMER_INSTALL_LINKING_POSTGRES_RUNTIME_CONNECTION_FILE:?Set the container-user-owned InstallLinking PostgreSQL runtime connection file}:/run/chummer-secrets/install-linking-postgres-runtime.connection-string:ro
    # Deliberately invalid/non-mutating: import requires an explicit command and confirmation flag.
    command: ["refuse-import-without-explicit-command"]
    networks:
      public-origin: {}

  chummer-run-cloudflared:
    image: "cloudflare/cloudflared:${CHUMMER_CLOUDFLARED_IMAGE_TAG:-2026.7.0}"
    container_name: chummer-run-cloudflared
    restart: unless-stopped
    depends_on:
      chummer-portal:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token
      - "${CHUMMER_RUN_CF_TUNNEL_TOKEN:?set CHUMMER_RUN_CF_TUNNEL_TOKEN in an ignored .env file}"
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      public-origin: {}
    mem_limit: ${CHUMMER_CLOUDFLARED_MEMORY_LIMIT:-256m}

volumes:
  chummer-public-blazor-state:
  chummer-play-web-state:
  chummer-run-api-state:
  chummer-release-upload-sessions:
  chummer-windows-proof-store:
  chummer-windows-proof-upload-sessions:
  chummer-run-identity-state:

networks:
  public-origin:
    external: true
    name: "${CHUMMER_RUN_TUNNEL_NETWORK:-chummer5a_default}"
  fleet-origin:
    external: true
    name: "${CHUMMER_FLEET_NETWORK:-codex-fleet-net}"
  ea-origin:
    external: true
    name: "${CHUMMER_EA_NETWORK:-ea_default}"

services:
  support-progress-mock:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "/workspace/scripts/support_progress_mock.py"]
    environment:
      SUPPORT_PROGRESS_MOCK_HOST: 0.0.0.0
      SUPPORT_PROGRESS_MOCK_PORT: 8080
      SUPPORT_PROGRESS_EMAILIT_API_KEY: ${IDENTITY_EMAILIT_API_KEY:-}
      SUPPORT_PROGRESS_EMAILIT_BASE_URL: ${IDENTITY_EMAILIT_BASE_URL:-https://api.emailit.com/v2}
      SUPPORT_PROGRESS_EMAILIT_FROM_EMAIL: ${IDENTITY_EMAILIT_FROM_EMAIL:-concierge@chummer.run}
      SUPPORT_PROGRESS_EMAILIT_FROM_NAME: ${IDENTITY_EMAILIT_FROM_NAME:-Chummer Concierge}
      SUPPORT_PROGRESS_EMAILIT_REPLY_TO: ${IDENTITY_EMAIL_REPLY_TO:-support@chummer.run}
    volumes:
      - /docker/chummercomplete/chummer.run-services/scripts:/workspace/scripts:ro
    networks:
      public-origin:
        aliases:
          - support-progress-mock

  chummer-run-identity:
    image: chummer-run-identity:local
    restart: unless-stopped
    build:
      context: /docker
      dockerfile: chummercomplete/chummer.run-services/Chummer.Run.Identity/Dockerfile
    environment:
      ASPNETCORE_HTTPS_PORT: ${ASPNETCORE_HTTPS_PORT:-443}
      IDENTITY_ENABLE_HTTPS_REDIRECTION: ${IDENTITY_ENABLE_HTTPS_REDIRECTION:-false}
      CHUMMER_IDENTITY_STORE_PATH: /app/state/identity-store.json
      CHUMMER_IDENTITY_EMAIL_DELIVERY_STORE_PATH: /app/state/identity-email-delivery.json
      IDENTITY_PUBLIC_BASE_URL: ${IDENTITY_PUBLIC_BASE_URL:-https://chummer.run}
      IDENTITY_ADMIN_KEY: ${IDENTITY_ADMIN_KEY:-}
      IDENTITY_EMAIL_PROVIDER_ORDER: ${IDENTITY_EMAIL_PROVIDER_ORDER:-}
      IDENTITY_EMAIL_REPLY_TO: ${IDENTITY_EMAIL_REPLY_TO:-support@chummer.run}
      IDENTITY_EMAILIT_API_KEY: ${IDENTITY_EMAILIT_API_KEY:-}
      IDENTITY_EMAILIT_BASE_URL: ${IDENTITY_EMAILIT_BASE_URL:-https://api.emailit.com/v2}
      IDENTITY_EMAILIT_FROM_EMAIL: ${IDENTITY_EMAILIT_FROM_EMAIL:-concierge@chummer.run}
      IDENTITY_EMAILIT_FROM_NAME: ${IDENTITY_EMAILIT_FROM_NAME:-Chummer Concierge}
      IDENTITY_EMAILIT_WEBHOOK_SECRET: ${IDENTITY_EMAILIT_WEBHOOK_SECRET:-}
      IDENTITY_SMTP_HOST: ${IDENTITY_SMTP_HOST:-}
      IDENTITY_SMTP_PORT: ${IDENTITY_SMTP_PORT:-587}
      IDENTITY_SMTP_USERNAME: ${IDENTITY_SMTP_USERNAME:-}
      IDENTITY_SMTP_PASSWORD: ${IDENTITY_SMTP_PASSWORD:-}
      IDENTITY_SMTP_FROM_EMAIL: ${IDENTITY_SMTP_FROM_EMAIL:-concierge@chummer.run}
      IDENTITY_SMTP_FROM_NAME: ${IDENTITY_SMTP_FROM_NAME:-Chummer Concierge}
      IDENTITY_SMTP_USE_SSL: ${IDENTITY_SMTP_USE_SSL:-true}
    volumes:
      - chummer-run-identity-state:/app/state
    networks:
      public-origin:
        aliases:
          - chummer-run-identity

  chummer-portal:
    image: chummer-run-api:local
    restart: unless-stopped
    build:
      context: /docker
      dockerfile: chummercomplete/chummer.run-services/Chummer.Run.Api/Dockerfile
    depends_on:
      - chummer-run-identity
      - support-progress-mock
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTPS_PORT: ${ASPNETCORE_HTTPS_PORT:-443}
      CHUMMER_PUBLIC_CANON_ROOT: /app
      CHUMMER_PUBLIC_FLEET_ARTIFACT_ROOT: /fleet-artifacts
      CHUMMER_COMMUNITY_STORE_PATH: /app/state/community-store.json
      CHUMMER_DATA_PROTECTION_KEYS_PATH: /app/state/data-protection-keys
      CHUMMER_PUBLIC_CONCIERGE_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_STORE_PATH: /app/state/public-concierge-store.json
      CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_NOW_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_NOW_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_CONTACT_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_CONTACT_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_INVITE_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_INVITE_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_CREATOR_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_CREATOR_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_WIDGET_URL: ${CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_WIDGET_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_NOW_WIDGET_URL: ${CHUMMER_PUBLIC_CONCIERGE_NOW_WIDGET_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_CONTACT_WIDGET_URL: ${CHUMMER_PUBLIC_CONCIERGE_CONTACT_WIDGET_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_INVITE_WIDGET_URL: ${CHUMMER_PUBLIC_CONCIERGE_INVITE_WIDGET_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_CREATOR_WIDGET_URL: ${CHUMMER_PUBLIC_CONCIERGE_CREATOR_WIDGET_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_WIDGET_URL: ${CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_WIDGET_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_BRANCH_SETUP_HELP_URL: ${CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_BRANCH_SETUP_HELP_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_BRANCH_HUMAN_SETUP_CALL_URL: ${CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_BRANCH_HUMAN_SETUP_CALL_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_NOW_BRANCH_UPDATE_HELP_URL: ${CHUMMER_PUBLIC_CONCIERGE_NOW_BRANCH_UPDATE_HELP_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_NOW_BRANCH_BOOK_HELP_URL: ${CHUMMER_PUBLIC_CONCIERGE_NOW_BRANCH_BOOK_HELP_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_CONTACT_BRANCH_PRIVATE_SUPPORT_URL: ${CHUMMER_PUBLIC_CONCIERGE_CONTACT_BRANCH_PRIVATE_SUPPORT_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_CONTACT_BRANCH_HUMAN_HELP_URL: ${CHUMMER_PUBLIC_CONCIERGE_CONTACT_BRANCH_HUMAN_HELP_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_INVITE_BRANCH_ASK_QUESTIONS_URL: ${CHUMMER_PUBLIC_CONCIERGE_INVITE_BRANCH_ASK_QUESTIONS_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_INVITE_BRANCH_SESSION_ZERO_CALL_URL: ${CHUMMER_PUBLIC_CONCIERGE_INVITE_BRANCH_SESSION_ZERO_CALL_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_CREATOR_BRANCH_BOOK_CONSULT_URL: ${CHUMMER_PUBLIC_CONCIERGE_CREATOR_BRANCH_BOOK_CONSULT_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_CREATOR_BRANCH_SUBMIT_INTEREST_URL: ${CHUMMER_PUBLIC_CONCIERGE_CREATOR_BRANCH_SUBMIT_INTEREST_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_BRANCH_VIDEO_REVIEW_URL: ${CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_BRANCH_VIDEO_REVIEW_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_BRANCH_AUDIO_REVIEW_URL: ${CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_BRANCH_AUDIO_REVIEW_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_PROVIDER_FACEPOP_WEBHOOK_SECRET: ${CHUMMER_PUBLIC_CONCIERGE_PROVIDER_FACEPOP_WEBHOOK_SECRET:-}
      CHUMMER_PUBLIC_CONCIERGE_PROVIDER_LUNACAL_WEBHOOK_SECRET: ${CHUMMER_PUBLIC_CONCIERGE_PROVIDER_LUNACAL_WEBHOOK_SECRET:-}
      CHUMMER_PUBLIC_CONCIERGE_PROVIDER_DEFTFORM_WEBHOOK_SECRET: ${CHUMMER_PUBLIC_CONCIERGE_PROVIDER_DEFTFORM_WEBHOOK_SECRET:-}
      CHUMMER_RELEASE_UPLOAD_TICKET_LIFETIME_MINUTES: ${CHUMMER_RELEASE_UPLOAD_TICKET_LIFETIME_MINUTES:-720}
      CHUMMER_PUBLIC_DISABLED_ARTIFACT_IDS: ${CHUMMER_PUBLIC_DISABLED_ARTIFACT_IDS:-}
      CHUMMER_PUBLIC_SKIP_STARTUP_SMOKE_FILTER: ${CHUMMER_PUBLIC_SKIP_STARTUP_SMOKE_FILTER:-true}
      IDENTITY_SERVICE_BASE_URL: http://chummer-run-identity:8080
      IDENTITY_ADMIN_KEY: ${IDENTITY_ADMIN_KEY:-}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-}
      GOOGLE_OIDC_REDIRECT_URI: ${GOOGLE_OIDC_REDIRECT_URI:-https://chummer.run/auth/google/callback}
      FLEET_CONTROLLER_BASE_URL: ${FLEET_CONTROLLER_BASE_URL:-http://fleet-controller:8090}
      FLEET_INTERNAL_API_TOKEN: ${FLEET_INTERNAL_API_TOKEN:-}
      CHUMMER_PARTICIPATION_DEFAULT_PROJECT_ID: ${CHUMMER_PARTICIPATION_DEFAULT_PROJECT_ID:-hub}
      CHUMMER_DOWNLOADS_SOURCE_ROOT: /downloads-source
      CHUMMER_PUBLIC_FORCE_ACCOUNT_REQUIRED_DOWNLOADS: ${CHUMMER_PUBLIC_FORCE_ACCOUNT_REQUIRED_DOWNLOADS:-true}
      CHUMMER_API_READ_RATE_LIMIT_PER_MINUTE: ${CHUMMER_API_READ_RATE_LIMIT_PER_MINUTE:-5000}
      CHUMMER_API_PUBLIC_RATE_LIMIT_PER_MINUTE: ${CHUMMER_API_PUBLIC_RATE_LIMIT_PER_MINUTE:-5000}
      CHUMMER_API_WRITE_RATE_LIMIT_PER_MINUTE: ${CHUMMER_API_WRITE_RATE_LIMIT_PER_MINUTE:-120}
      CHUMMER_API_RATE_LIMIT_QUEUE: ${CHUMMER_API_RATE_LIMIT_QUEUE:-16}
      CHUMMER_BLACK_LEDGER_NEWS_EMAIL_ENABLED: ${CHUMMER_BLACK_LEDGER_NEWS_EMAIL_ENABLED:-true}
      CHUMMER_BLACK_LEDGER_NEWS_EMAIL_POLICY: ${CHUMMER_BLACK_LEDGER_NEWS_EMAIL_POLICY:-operator_only}
      CHUMMER_BLACK_LEDGER_NEWS_OPERATOR_TO: ${CHUMMER_BLACK_LEDGER_NEWS_OPERATOR_TO:-}
      CHUMMER_BLACK_LEDGER_NEWS_EA_BASE_URL: ${CHUMMER_BLACK_LEDGER_NEWS_EA_BASE_URL:-http://support-progress-mock:8080}
      CHUMMER_BLACK_LEDGER_NEWS_EA_API_TOKEN: ${CHUMMER_BLACK_LEDGER_NEWS_EA_API_TOKEN:-local-support-progress-token}
      CHUMMER_BLACK_LEDGER_NEWS_EA_PRINCIPAL_ID: ${CHUMMER_BLACK_LEDGER_NEWS_EA_PRINCIPAL_ID:-support-progress-principal}
      CHUMMER_BLACK_LEDGER_NEWS_EA_BINDING_ID: ${CHUMMER_BLACK_LEDGER_NEWS_EA_BINDING_ID:-binding-support-progress}
      CHUMMER_BLACK_LEDGER_NEWS_HASH_SALT: ${CHUMMER_BLACK_LEDGER_NEWS_HASH_SALT:-black-ledger-news}
      CHUMMER_SUPPORT_PROGRESS_EMAIL_EA_BASE_URL: ${CHUMMER_SUPPORT_PROGRESS_EMAIL_EA_BASE_URL:-http://support-progress-mock:8080}
      CHUMMER_SUPPORT_PROGRESS_EMAIL_EA_API_TOKEN: ${CHUMMER_SUPPORT_PROGRESS_EMAIL_EA_API_TOKEN:-local-support-progress-token}
      CHUMMER_SUPPORT_PROGRESS_EMAIL_EA_PRINCIPAL_ID: ${CHUMMER_SUPPORT_PROGRESS_EMAIL_EA_PRINCIPAL_ID:-support-progress-principal}
      CHUMMER_SUPPORT_PROGRESS_EMAIL_EA_BINDING_ID: ${CHUMMER_SUPPORT_PROGRESS_EMAIL_EA_BINDING_ID:-binding-support-progress}
      CHUMMER_SUPPORT_PROGRESS_EMAIL_EMAILIT_API_KEY: ${CHUMMER_SUPPORT_PROGRESS_EMAIL_EMAILIT_API_KEY:-local-support-progress-emailit-token}
      CHUMMER_SUPPORT_PROGRESS_EMAIL_EMAILIT_BASE_URL: ${CHUMMER_SUPPORT_PROGRESS_EMAIL_EMAILIT_BASE_URL:-http://support-progress-mock:8080}
      CHUMMER_SUPPORT_PROGRESS_EMAIL_PUBLIC_BASE_URL: ${CHUMMER_SUPPORT_PROGRESS_EMAIL_PUBLIC_BASE_URL:-https://chummer.run}
      CHUMMER_TEABLE_USERS_ENABLED: ${CHUMMER_TEABLE_USERS_ENABLED:-true}
      CHUMMER_TEABLE_USERS_API_KEY: ${CHUMMER_TEABLE_USERS_API_KEY:-}
      TEABLE_API_KEY: ${TEABLE_API_KEY:-}
      CHUMMER_TEABLE_USERS_API_BASE_URL: ${CHUMMER_TEABLE_USERS_API_BASE_URL:-https://app.teable.ai/api}
      CHUMMER_TEABLE_USERS_BASE_ID: ${CHUMMER_TEABLE_USERS_BASE_ID:-}
      CHUMMER_TEABLE_USERS_TABLE_ID: ${CHUMMER_TEABLE_USERS_TABLE_ID:-}
      CHUMMER_TEABLE_USERS_TABLE_NAME: ${CHUMMER_TEABLE_USERS_TABLE_NAME:-Chummer Run Users}
      CHUMMER_TEABLE_USERS_RECONCILE_ENABLED: ${CHUMMER_TEABLE_USERS_RECONCILE_ENABLED:-true}
      CHUMMER_TEABLE_USERS_RECONCILE_INITIAL_DELAY_SECONDS: ${CHUMMER_TEABLE_USERS_RECONCILE_INITIAL_DELAY_SECONDS:-15}
      CHUMMER_TEABLE_USERS_RECONCILE_INTERVAL_MINUTES: ${CHUMMER_TEABLE_USERS_RECONCILE_INTERVAL_MINUTES:-30}
      CHUMMER_TEABLE_KARMA_FORGE_ENABLED: ${CHUMMER_TEABLE_KARMA_FORGE_ENABLED:-true}
      CHUMMER_TEABLE_KARMA_FORGE_API_KEY: ${CHUMMER_TEABLE_KARMA_FORGE_API_KEY:-}
      CHUMMER_TEABLE_KARMA_FORGE_API_BASE_URL: ${CHUMMER_TEABLE_KARMA_FORGE_API_BASE_URL:-https://app.teable.ai/api}
      CHUMMER_TEABLE_KARMA_FORGE_BASE_ID: ${CHUMMER_TEABLE_KARMA_FORGE_BASE_ID:-}
      CHUMMER_TEABLE_KARMA_FORGE_TABLE_ID: ${CHUMMER_TEABLE_KARMA_FORGE_TABLE_ID:-}
      CHUMMER_TEABLE_KARMA_FORGE_TABLE_NAME: ${CHUMMER_TEABLE_KARMA_FORGE_TABLE_NAME:-Karma Forge Review Board}
      CHUMMER_TEABLE_KARMA_FORGE_RECONCILE_ENABLED: ${CHUMMER_TEABLE_KARMA_FORGE_RECONCILE_ENABLED:-true}
      CHUMMER_TEABLE_KARMA_FORGE_RECONCILE_INITIAL_DELAY_SECONDS: ${CHUMMER_TEABLE_KARMA_FORGE_RECONCILE_INITIAL_DELAY_SECONDS:-15}
      CHUMMER_TEABLE_KARMA_FORGE_RECONCILE_INTERVAL_MINUTES: ${CHUMMER_TEABLE_KARMA_FORGE_RECONCILE_INTERVAL_MINUTES:-30}
      CHUMMER_TEABLE_BLACK_LEDGER_ENABLED: ${CHUMMER_TEABLE_BLACK_LEDGER_ENABLED:-true}
      CHUMMER_TEABLE_BLACK_LEDGER_API_KEY: ${CHUMMER_TEABLE_BLACK_LEDGER_API_KEY:-}
      CHUMMER_TEABLE_BLACK_LEDGER_API_BASE_URL: ${CHUMMER_TEABLE_BLACK_LEDGER_API_BASE_URL:-https://app.teable.ai/api}
      CHUMMER_TEABLE_BLACK_LEDGER_BASE_ID: ${CHUMMER_TEABLE_BLACK_LEDGER_BASE_ID:-}
      CHUMMER_TEABLE_BLACK_LEDGER_TABLE_ID: ${CHUMMER_TEABLE_BLACK_LEDGER_TABLE_ID:-}
      CHUMMER_TEABLE_BLACK_LEDGER_TABLE_NAME: ${CHUMMER_TEABLE_BLACK_LEDGER_TABLE_NAME:-Black Ledger World Ticks}
      CHUMMER_TEABLE_BLACK_LEDGER_RECONCILE_ENABLED: ${CHUMMER_TEABLE_BLACK_LEDGER_RECONCILE_ENABLED:-true}
      CHUMMER_TEABLE_BLACK_LEDGER_RECONCILE_INITIAL_DELAY_SECONDS: ${CHUMMER_TEABLE_BLACK_LEDGER_RECONCILE_INITIAL_DELAY_SECONDS:-15}
      CHUMMER_TEABLE_BLACK_LEDGER_RECONCILE_INTERVAL_MINUTES: ${CHUMMER_TEABLE_BLACK_LEDGER_RECONCILE_INTERVAL_MINUTES:-30}
      CHUMMER_FORWARDED_HEADER_TRUSTED_PROXIES: ${CHUMMER_FORWARDED_HEADER_TRUSTED_PROXIES:-}
      CHUMMER_FORWARDED_HEADER_TRUSTED_IP_NETWORKS: ${CHUMMER_FORWARDED_HEADER_TRUSTED_IP_NETWORKS:-}
      CHUMMER_RELEASE_UPLOAD_ALLOWED_EMAILS: ${CHUMMER_RELEASE_UPLOAD_ALLOWED_EMAILS:-}
    volumes:
      - chummer-run-api-state:/app/state
      - /docker/fleet/.codex-studio/published:/fleet-artifacts:ro
      - /docker/chummercomplete/chummer.run-services/Chummer.Portal/downloads:/downloads-source
    ports:
      - "${CHUMMER_PUBLIC_EDGE_PORT:-8091}:8080"
    networks:
      public-origin:
        aliases:
          - ${CHUMMER_PUBLIC_EDGE_ALIAS:-chummer-portal}
      fleet-origin: {}

volumes:
  chummer-run-api-state:
  chummer-run-identity-state:

networks:
  public-origin:
    external: true
    name: "${CHUMMER_RUN_TUNNEL_NETWORK:-chummer5a_default}"
  fleet-origin:
    external: true
    name: "${CHUMMER_FLEET_NETWORK:-codex-fleet-net}"

services:
  support-progress-mock:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "/workspace/scripts/support_progress_mock.py"]
    environment:
      SUPPORT_PROGRESS_MOCK_HOST: 0.0.0.0
      SUPPORT_PROGRESS_MOCK_PORT: 8080
      SUPPORT_PROGRESS_EMAILIT_API_KEY: ${SUPPORT_PROGRESS_EMAILIT_API_KEY:-}
      SUPPORT_PROGRESS_EMAILIT_BASE_URL: ${IDENTITY_EMAILIT_BASE_URL:-https://api.emailit.com/v2}
      SUPPORT_PROGRESS_EMAILIT_FROM_EMAIL: ${IDENTITY_EMAILIT_FROM_EMAIL:-concierge@chummer.run}
      SUPPORT_PROGRESS_EMAILIT_FROM_NAME: ${IDENTITY_EMAILIT_FROM_NAME:-Chummer Concierge}
      SUPPORT_PROGRESS_EMAILIT_REPLY_TO: ${IDENTITY_EMAIL_REPLY_TO:-support@chummer.run}
    volumes:
      - /docker/chummercomplete/chummer.run-services/scripts:/workspace/scripts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: ${CHUMMER_SUPPORT_PROGRESS_MEMORY_LIMIT:-128m}
    networks:
      public-origin:
        aliases:
          - support-progress-mock

  chummer-presentation-api:
    image: chummer-presentation-api:local
    restart: unless-stopped
    build:
      context: /docker/chummercomplete
      dockerfile: chummer-presentation/Chummer.Api/Dockerfile
      args:
        CHUMMER_BUILD_CONCURRENCY: ${CHUMMER_BUILD_CONCURRENCY:-1}
    environment:
      CHUMMER_PORTAL_OWNER_SHARED_KEY: ${CHUMMER_PORTAL_OWNER_SHARED_KEY:-public-edge-blazor-owner-shared-key}
      CHUMMER_PORTAL_OWNER_MAX_AGE_SECONDS: ${CHUMMER_PORTAL_OWNER_MAX_AGE_SECONDS:-300}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${CHUMMER_PRESENTATION_API_MEMORY_LIMIT:-1g}
    cpu_shares: 128
    cpus: ${CHUMMER_PRESENTATION_API_CPUS:-0.75}
    networks:
      public-origin:
        aliases:
          - chummer-presentation-api

  chummer-public-blazor:
    image: chummer-public-blazor:local
    restart: unless-stopped
    build:
      context: /docker/chummercomplete
      dockerfile: chummer-presentation/Chummer.Blazor/Dockerfile
      args:
        CHUMMER_BUILD_CONCURRENCY: ${CHUMMER_BUILD_CONCURRENCY:-1}
    depends_on:
      chummer-presentation-api:
        condition: service_healthy
    environment:
      CHUMMER_API_BASE_URL: http://chummer-presentation-api:8080
      CHUMMER_BLAZOR_PATH_BASE: /blazor
      CHUMMER_ANALYTICS_PROVIDER: rybbit
      CHUMMER_RYBBIT_SITE_ID: ${RYBBIT_CHUMMER_RUN_SITE_ID:-}
      CHUMMER_RYBBIT_SCRIPT_URL: ${RYBBIT_CHUMMER_RUN_SCRIPT_URL:-}
      CHUMMER_RYBBIT_BASE_URL: ${RYBBIT_CHUMMER_RUN_SCRIPT_ORIGIN:-https://app.rybbit.io}
      CHUMMER_BLAZOR_DATA_PROTECTION_KEYS_PATH: /app/state/data-protection-keys
    volumes:
      - chummer-public-blazor-state:/app/state
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:8080/blazor/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${CHUMMER_PUBLIC_BLAZOR_MEMORY_LIMIT:-1g}
    cpu_shares: 128
    cpus: ${CHUMMER_PUBLIC_BLAZOR_CPUS:-0.75}
    networks:
      public-origin:
        aliases:
          - chummer-public-blazor

  chummer-play-web:
    profiles: ["play-private"]
    image: chummer-play-web:local
    restart: unless-stopped
    build:
      context: /docker/chummercomplete
      dockerfile: chummer-play/src/Chummer.Play.Web/Dockerfile
      additional_contexts:
        play-source: /docker/chummercomplete/chummer-play
        core-engine-contracts: /docker/chummercomplete/chummer-core-engine/Chummer.Contracts
        campaign-contracts: /docker/chummercomplete/chummer.run-services/Chummer.Campaign.Contracts
        play-contracts: /docker/chummercomplete/chummer.run-services/Chummer.Play.Contracts
        ui-kit-source: /docker/chummercomplete/chummer-ui-kit
      args:
        CHUMMER_BUILD_CONCURRENCY: ${CHUMMER_BUILD_CONCURRENCY:-1}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      CHUMMER_PLAY_BROWSER_STATE_DIR: /app/state/browser-state
      CHUMMER_PLAY_API_KEY: ${CHUMMER_PLAY_API_KEY:-}
      RYBBIT_CHUMMER_PLAY_SITE_ID: ${RYBBIT_CHUMMER_PLAY_SITE_ID:-${RYBBIT_CHUMMER_RUN_SITE_ID:-}}
      RYBBIT_CHUMMER_PLAY_SCRIPT_URL: ${RYBBIT_CHUMMER_PLAY_SCRIPT_URL:-${RYBBIT_CHUMMER_RUN_SCRIPT_URL:-}}
      RYBBIT_CHUMMER_PLAY_SCRIPT_ORIGIN: ${RYBBIT_CHUMMER_PLAY_SCRIPT_ORIGIN:-${RYBBIT_CHUMMER_RUN_SCRIPT_ORIGIN:-https://app.rybbit.io}}
      RYBBIT_CHUMMER_PLAY_ALLOW_SAME_HOST_PROXY: ${RYBBIT_CHUMMER_PLAY_ALLOW_SAME_HOST_PROXY:-${RYBBIT_CHUMMER_RUN_ALLOW_SAME_HOST_PROXY:-false}}
    volumes:
      - chummer-play-web-state:/app/state
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${CHUMMER_PLAY_WEB_MEMORY_LIMIT:-768m}
    cpu_shares: 128
    cpus: ${CHUMMER_PLAY_WEB_CPUS:-0.50}
    networks:
      public-origin:
        aliases:
          - chummer-play-web

  chummer-run-identity:
    image: chummer-run-identity:local
    restart: unless-stopped
    build:
      context: ${CHUMMER_PUBLIC_EDGE_BUILD_CONTEXT:-/docker/chummercomplete}
      dockerfile: ${CHUMMER_RUN_SERVICES_CONTEXT_DIR:-chummer.run-services}/Chummer.Run.Identity/Dockerfile
      additional_contexts:
        run-services-source: ${CHUMMER_RUN_SERVICES_SOURCE:-/docker/chummercomplete/chummer.run-services}
        fleet-media-factory-contracts: /docker/fleet/repos/chummer-media-factory/src/Chummer.Media.Contracts
      args:
        CHUMMER_BUILD_CONCURRENCY: ${CHUMMER_BUILD_CONCURRENCY:-1}
    environment:
      ASPNETCORE_HTTPS_PORT: ${ASPNETCORE_HTTPS_PORT:-443}
      IDENTITY_ENABLE_HTTPS_REDIRECTION: ${IDENTITY_ENABLE_HTTPS_REDIRECTION:-false}
      CHUMMER_IDENTITY_STORE_PATH: /app/state/identity-store.json
      CHUMMER_IDENTITY_EMAIL_DELIVERY_STORE_PATH: /app/state/identity-email-delivery.json
      IDENTITY_PUBLIC_BASE_URL: ${IDENTITY_PUBLIC_BASE_URL:-https://chummer.run}
      IDENTITY_ADMIN_KEY: ${IDENTITY_ADMIN_KEY:-}
      IDENTITY_EMAIL_PROVIDER_ORDER: ${IDENTITY_EMAIL_PROVIDER_ORDER:-none}
      IDENTITY_EMAIL_START_ENABLED: ${IDENTITY_EMAIL_START_ENABLED:-false}
      IDENTITY_EMAIL_START_WINDOW_SECONDS: ${IDENTITY_EMAIL_START_WINDOW_SECONDS:-900}
      IDENTITY_EMAIL_START_MAX_ATTEMPTS_PER_WINDOW: ${IDENTITY_EMAIL_START_MAX_ATTEMPTS_PER_WINDOW:-60}
      IDENTITY_EMAIL_START_MAX_ATTEMPTS_PER_RECIPIENT_PER_WINDOW: ${IDENTITY_EMAIL_START_MAX_ATTEMPTS_PER_RECIPIENT_PER_WINDOW:-3}
      IDENTITY_EMAIL_START_MIN_SECONDS_BETWEEN_RECIPIENT_ATTEMPTS: ${IDENTITY_EMAIL_START_MIN_SECONDS_BETWEEN_RECIPIENT_ATTEMPTS:-120}
      IDENTITY_EMAIL_REPLY_TO: ${IDENTITY_EMAIL_REPLY_TO:-support@chummer.run}
      IDENTITY_EMAILIT_API_KEY: ${IDENTITY_EMAILIT_API_KEY:-}
      IDENTITY_EMAILIT_BASE_URL: ${IDENTITY_EMAILIT_BASE_URL:-https://api.emailit.com/v2}
      IDENTITY_EMAILIT_FROM_EMAIL: ${IDENTITY_EMAILIT_FROM_EMAIL:-concierge@chummer.run}
      IDENTITY_EMAILIT_FROM_NAME: ${IDENTITY_EMAILIT_FROM_NAME:-Chummer Concierge}
      IDENTITY_EMAILIT_WEBHOOK_SECRET: ${IDENTITY_EMAILIT_WEBHOOK_SECRET:-}
      IDENTITY_SMTP_HOST: ${IDENTITY_SMTP_HOST:-}
      IDENTITY_SMTP_PORT: ${IDENTITY_SMTP_PORT:-587}
      IDENTITY_SMTP_USERNAME: ${IDENTITY_SMTP_USERNAME:-}
      IDENTITY_SMTP_PASSWORD: ${IDENTITY_SMTP_PASSWORD:-}
      IDENTITY_SMTP_FROM_EMAIL: ${IDENTITY_SMTP_FROM_EMAIL:-concierge@chummer.run}
      IDENTITY_SMTP_FROM_NAME: ${IDENTITY_SMTP_FROM_NAME:-Chummer Concierge}
      IDENTITY_SMTP_USE_SSL: ${IDENTITY_SMTP_USE_SSL:-true}
    volumes:
      - chummer-run-identity-state:/app/state
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${CHUMMER_IDENTITY_MEMORY_LIMIT:-512m}
    cpu_shares: 128
    cpus: ${CHUMMER_IDENTITY_CPUS:-0.50}
    networks:
      public-origin:
        aliases:
          - chummer-run-identity
      fleet-origin: {}

  chummer-portal-volume-init:
    image: chummer-run-api:local
    restart: "no"
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    network_mode: "none"
    ulimits:
      core: 0
    pids_limit: 32
    environment:
      CHUMMER_PORTAL_UID: "${CHUMMER_PORTAL_UID:-1654}"
      CHUMMER_PORTAL_GID: "${CHUMMER_PORTAL_GID:-1654}"
    entrypoint:
      - /usr/local/libexec/chummer/initialize-public-edge-volumes.sh
    volumes:
      - chummer-run-api-state:/app/state
      - chummer-release-upload-sessions:/release-upload-sessions
      - chummer-windows-proof-store:/windows-proof-store
      - chummer-windows-proof-upload-sessions:/windows-proof-upload-sessions
      # This host bind is probed as the portal identity but is never chowned by the initializer.
      - /docker/chummercomplete/chummer.run-services/Chummer.Portal/downloads:/downloads-source

  chummer-portal:
    image: chummer-run-api:local
    restart: unless-stopped
    build:
      context: ${CHUMMER_PUBLIC_EDGE_BUILD_CONTEXT:-/docker/chummercomplete}
      dockerfile: ${CHUMMER_RUN_SERVICES_CONTEXT_DIR:-chummer.run-services}/Chummer.Run.Api/Dockerfile
      additional_contexts:
        run-services-source: ${CHUMMER_RUN_SERVICES_SOURCE:-/docker/chummercomplete/chummer.run-services}
        fleet-media-factory-contracts: /docker/fleet/repos/chummer-media-factory/src/Chummer.Media.Contracts
        design-product: /docker/chummercomplete/chummer-design
      args:
        CHUMMER_BUILD_CONCURRENCY: ${CHUMMER_BUILD_CONCURRENCY:-1}
        CHUMMER_RUNTIME_UID: ${CHUMMER_PORTAL_UID:-1654}
        CHUMMER_RUNTIME_GID: ${CHUMMER_PORTAL_GID:-1654}
    user: "${CHUMMER_PORTAL_UID:-1654}:${CHUMMER_PORTAL_GID:-1654}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    env_file:
      - /docker/fleet/secrets/codexliz-cf-access.env
    depends_on:
      chummer-portal-volume-init:
        condition: service_completed_successfully
      chummer-public-blazor:
        condition: service_healthy
      chummer-run-identity:
        condition: service_healthy
      support-progress-mock:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTPS_PORT: ${ASPNETCORE_HTTPS_PORT:-443}
      CHUMMER_ENABLE_HTTPS_REDIRECTION: ${CHUMMER_ENABLE_HTTPS_REDIRECTION:-false}
      AllowedHosts: ${CHUMMER_PUBLIC_ALLOWED_HOSTS:-chummer.run}
      CHUMMER_PUBLIC_ALLOWED_HOSTS: ${CHUMMER_PUBLIC_ALLOWED_HOSTS:-chummer.run}
      CHUMMER_PUBLIC_CANONICAL_ORIGIN: ${CHUMMER_PUBLIC_CANONICAL_ORIGIN:-https://chummer.run}
      CHUMMER_PUBLIC_CANON_ROOT: /app
      CHUMMER_PUBLIC_FLEET_ARTIFACT_ROOT: /fleet-artifacts
      CHUMMER_COMMUNITY_STORE_PATH: /app/state/community-store.json
      CHUMMER_DATA_PROTECTION_KEYS_PATH: /app/state/data-protection-keys
      CHUMMER_DATA_PROTECTION_CERTIFICATE_PATH: /run/chummer-secrets/data-protection-key-encryption.pfx
      CHUMMER_DATA_PROTECTION_CERTIFICATE_PASSWORD_FILE: /run/chummer-secrets/data-protection-key-encryption.password
      # PostgreSQL is the cross-host rollback authority, but the process-local mutation model still
      # treats a compare-and-swap conflict as terminal. Keep one portal writer until reload/retry exists.
      CHUMMER_INSTALL_LINKING_STORE_PATH: /app/state/install-linking/install-linking-store.json
      CHUMMER_INSTALL_LINKING_POSTGRES_CONNECTION_STRING_FILE: /run/chummer-secrets/install-linking-postgres-runtime.connection-string
      CHUMMER_PUBLIC_CONCIERGE_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_STORE_PATH: /app/state/public-concierge-store.json
      CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_NOW_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_NOW_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_CONTACT_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_CONTACT_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_INVITE_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_INVITE_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_CREATOR_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_CREATOR_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_ENABLED: ${CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_ENABLED:-true}
      CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_WIDGET_URL: ${CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_WIDGET_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_NOW_WIDGET_URL: ${CHUMMER_PUBLIC_CONCIERGE_NOW_WIDGET_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_CONTACT_WIDGET_URL: ${CHUMMER_PUBLIC_CONCIERGE_CONTACT_WIDGET_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_INVITE_WIDGET_URL: ${CHUMMER_PUBLIC_CONCIERGE_INVITE_WIDGET_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_CREATOR_WIDGET_URL: ${CHUMMER_PUBLIC_CONCIERGE_CREATOR_WIDGET_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_WIDGET_URL: ${CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_WIDGET_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_BRANCH_SETUP_HELP_URL: ${CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_BRANCH_SETUP_HELP_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_BRANCH_HUMAN_SETUP_CALL_URL: ${CHUMMER_PUBLIC_CONCIERGE_DOWNLOADS_BRANCH_HUMAN_SETUP_CALL_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_NOW_BRANCH_UPDATE_HELP_URL: ${CHUMMER_PUBLIC_CONCIERGE_NOW_BRANCH_UPDATE_HELP_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_NOW_BRANCH_BOOK_HELP_URL: ${CHUMMER_PUBLIC_CONCIERGE_NOW_BRANCH_BOOK_HELP_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_CONTACT_BRANCH_PRIVATE_SUPPORT_URL: ${CHUMMER_PUBLIC_CONCIERGE_CONTACT_BRANCH_PRIVATE_SUPPORT_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_CONTACT_BRANCH_HUMAN_HELP_URL: ${CHUMMER_PUBLIC_CONCIERGE_CONTACT_BRANCH_HUMAN_HELP_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_INVITE_BRANCH_ASK_QUESTIONS_URL: ${CHUMMER_PUBLIC_CONCIERGE_INVITE_BRANCH_ASK_QUESTIONS_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_INVITE_BRANCH_SESSION_ZERO_CALL_URL: ${CHUMMER_PUBLIC_CONCIERGE_INVITE_BRANCH_SESSION_ZERO_CALL_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_CREATOR_BRANCH_BOOK_CONSULT_URL: ${CHUMMER_PUBLIC_CONCIERGE_CREATOR_BRANCH_BOOK_CONSULT_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_CREATOR_BRANCH_SUBMIT_INTEREST_URL: ${CHUMMER_PUBLIC_CONCIERGE_CREATOR_BRANCH_SUBMIT_INTEREST_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_BRANCH_VIDEO_REVIEW_URL: ${CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_BRANCH_VIDEO_REVIEW_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_BRANCH_AUDIO_REVIEW_URL: ${CHUMMER_PUBLIC_CONCIERGE_TESTIMONIALS_BRANCH_AUDIO_REVIEW_URL:-}
      CHUMMER_PUBLIC_CONCIERGE_PROVIDER_FACEPOP_WEBHOOK_SECRET: ${CHUMMER_PUBLIC_CONCIERGE_PROVIDER_FACEPOP_WEBHOOK_SECRET:-}
      CHUMMER_PUBLIC_CONCIERGE_PROVIDER_LUNACAL_WEBHOOK_SECRET: ${CHUMMER_PUBLIC_CONCIERGE_PROVIDER_LUNACAL_WEBHOOK_SECRET:-}
      CHUMMER_PUBLIC_CONCIERGE_PROVIDER_DEFTFORM_WEBHOOK_SECRET: ${CHUMMER_PUBLIC_CONCIERGE_PROVIDER_DEFTFORM_WEBHOOK_SECRET:-}
      CHUMMER_RELEASE_UPLOAD_TICKET_LIFETIME_MINUTES: ${CHUMMER_RELEASE_UPLOAD_TICKET_LIFETIME_MINUTES:-720}
      CHUMMER_PUBLIC_DISABLED_ARTIFACT_IDS: ${CHUMMER_PUBLIC_DISABLED_ARTIFACT_IDS:-}
      CHUMMER_PUBLIC_SKIP_STARTUP_SMOKE_FILTER: ${CHUMMER_PUBLIC_SKIP_STARTUP_SMOKE_FILTER:-true}
      IDENTITY_SERVICE_BASE_URL: http://chummer-run-identity:8080
      IDENTITY_ADMIN_KEY: ${IDENTITY_ADMIN_KEY:-}
      IDENTITY_EMAIL_START_ENABLED: ${IDENTITY_EMAIL_START_ENABLED:-false}
      CHUMMER_ORIGIN_DOSSIER_PUBLICATION_INDEX: ${CHUMMER_ORIGIN_DOSSIER_PUBLICATION_INDEX:-/app/state/origin-dossier-publications.json}
      CHUMMER_ORIGIN_AUDIOBOOKSHELF_TRUSTED_HOSTS: ${CHUMMER_ORIGIN_AUDIOBOOKSHELF_TRUSTED_HOSTS:-audio.chummer.run,audiobookshelf.chummer.run,audiobookshelf.girschele.com}
      CHUMMER_ORIGIN_PROVIDER_ACCOUNT_REGISTRY_PATH: ${CHUMMER_ORIGIN_PROVIDER_ACCOUNT_REGISTRY_PATH:-}
      CHUMMER_ORIGIN_PROVIDER_ACCOUNT_REGISTRY: ${CHUMMER_ORIGIN_PROVIDER_ACCOUNT_REGISTRY:-}
      CHUMMER_ORIGIN_PROVIDER_ACCOUNT_ALIASES: ${CHUMMER_ORIGIN_PROVIDER_ACCOUNT_ALIASES:-}
      CHUMMER_ORIGIN_MANUSCRIPT_ACCOUNT_ALIASES: ${CHUMMER_ORIGIN_MANUSCRIPT_ACCOUNT_ALIASES:-}
      CHUMMER_ORIGIN_AUDIO_ACCOUNT_ALIASES: ${CHUMMER_ORIGIN_AUDIO_ACCOUNT_ALIASES:-}
      CHUMMER_ORIGIN_VISUAL_ACCOUNT_ALIASES: ${CHUMMER_ORIGIN_VISUAL_ACCOUNT_ALIASES:-}
      CHUMMER_ORIGIN_PACKAGING_ACCOUNT_ALIASES: ${CHUMMER_ORIGIN_PACKAGING_ACCOUNT_ALIASES:-}
      CHUMMER_ORIGIN_TELEGRAM_ACCOUNT_ALIASES: ${CHUMMER_ORIGIN_TELEGRAM_ACCOUNT_ALIASES:-}
      CHUMMER_ORIGIN_MANUSCRIPT_PROVIDER_TOKENS: ${CHUMMER_ORIGIN_MANUSCRIPT_PROVIDER_TOKENS:-}
      CHUMMER_ORIGIN_AUDIO_PROVIDER_TOKENS: ${CHUMMER_ORIGIN_AUDIO_PROVIDER_TOKENS:-}
      CHUMMER_ORIGIN_VISUAL_PREFERRED_PROVIDER_TOKENS: ${CHUMMER_ORIGIN_VISUAL_PREFERRED_PROVIDER_TOKENS:-}
      CHUMMER_ORIGIN_VISUAL_PROVIDER_TOKENS: ${CHUMMER_ORIGIN_VISUAL_PROVIDER_TOKENS:-}
      CHUMMER_ORIGIN_PACKAGING_PROVIDER_TOKENS: ${CHUMMER_ORIGIN_PACKAGING_PROVIDER_TOKENS:-}
      CHUMMER_RENDER_POOL_PROVIDER_TOKENS: ${CHUMMER_RENDER_POOL_PROVIDER_TOKENS:-}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-}
      GOOGLE_OIDC_REDIRECT_URI: ${GOOGLE_OIDC_REDIRECT_URI:-https://chummer.run/auth/google/callback}
      FLEET_CONTROLLER_BASE_URL: ${FLEET_CONTROLLER_BASE_URL:-http://fleet-controller:8090}
      FLEET_INTERNAL_API_TOKEN: ${FLEET_INTERNAL_API_TOKEN:-}
      CHUMMER_EA_CHANNEL_MESSAGING_WEBHOOK_TOKEN: ${CHUMMER_EA_CHANNEL_MESSAGING_WEBHOOK_TOKEN:-}
      CHUMMER_EA_WEBHOOK_TOKEN: ${CHUMMER_EA_WEBHOOK_TOKEN:-}
      CHUMMER_EA_CHANNEL_MESSAGING_EA_BASE_URL: ${CHUMMER_EA_CHANNEL_MESSAGING_EA_BASE_URL:-}
      CHUMMER_EA_CHANNEL_MESSAGING_EA_API_TOKEN: ${CHUMMER_EA_CHANNEL_MESSAGING_EA_API_TOKEN:-}
      CHUMMER_EA_CHANNEL_MESSAGING_EA_PRINCIPAL_ID: ${CHUMMER_EA_CHANNEL_MESSAGING_EA_PRINCIPAL_ID:-}
      CHUMMER_EA_CHANNEL_MESSAGING_EA_BINDING_ID: ${CHUMMER_EA_CHANNEL_MESSAGING_EA_BINDING_ID:-}
      CHUMMER_EA_CHANNEL_MESSAGING_EA_TELEGRAM_BINDING_ID: ${CHUMMER_EA_CHANNEL_MESSAGING_EA_TELEGRAM_BINDING_ID:-}
      CHUMMER_EA_CHANNEL_MESSAGING_EA_WHATSAPP_BINDING_ID: ${CHUMMER_EA_CHANNEL_MESSAGING_EA_WHATSAPP_BINDING_ID:-}
      CHUMMER_EA_CHANNEL_MESSAGING_EA_WHATSAPP_WEB_BINDING_ID: ${CHUMMER_EA_CHANNEL_MESSAGING_EA_WHATSAPP_WEB_BINDING_ID:-}
      CHUMMER_EA_CHANNEL_MESSAGING_EA_WHATSAPP_TRANSPORT: ${CHUMMER_EA_CHANNEL_MESSAGING_EA_WHATSAPP_TRANSPORT:-}
      CHUMMER_PARTICIPATION_DEFAULT_PROJECT_ID: ${CHUMMER_PARTICIPATION_DEFAULT_PROJECT_ID:-hub}
      CHUMMER_DOWNLOADS_SOURCE_ROOT: /downloads-source
      # Windows proof publication is independent from the canonical release shelf. Both
